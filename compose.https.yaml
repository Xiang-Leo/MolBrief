services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      MOLBRIEF_DOMAIN: ${MOLBRIEF_DOMAIN:?Set MOLBRIEF_DOMAIN in .env first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
